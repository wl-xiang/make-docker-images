# =====================================================================
# Build and Package Docker Images
#
# 完整链路：Git Clone 用户仓库 → 构建或拉取 Docker 镜像 → 打包 → 产出 TGZ Artifact
#
# 两种模式：
#   build : 从用户仓库的 Dockerfile 构建镜像（支持跨平台，QEMU 模拟）
#   pull  : 解析用户仓库的 Compose 文件，拉取其中定义的全部镜像
#
# 触发方式：workflow_dispatch（手动触发）
#
# 可选 Secrets：
#   CLONE_PAT          克隆私有 Git 仓库用的 PAT（repo 读权限）
#   REGISTRY_SERVER    私有镜像仓库地址（如 ghcr.io / registry.example.com:5000，默认 docker.io）
#   REGISTRY_USERNAME  私有镜像仓库用户名
#   REGISTRY_PASSWORD  私有镜像仓库密码/令牌
# =====================================================================

name: Build and Package Docker Images

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'GitHub 仓库克隆链接，例如 https://github.com/wl-xiang/code-server-ai.git'
        required: true
        type: string
      platform:
        description: '目标部署服务器平台'
        required: true
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
          - linux/arm64
      mode:
        description: '镜像获取模式：build = 从 Dockerfile 构建，pull = 从 Compose 拉取'
        required: true
        type: choice
        default: build
        options:
          - build
          - pull
      dockerfile_path:
        description: 'Dockerfile 路径（仅 mode=build 生效）。根目录填 Dockerfile，子目录填 path/to/Dockerfile'
        required: false
        default: 'Dockerfile'
        type: string
      compose_file_path:
        description: 'Docker Compose 文件路径（仅 mode=pull 生效）'
        required: false
        default: 'docker-compose.yml'
        type: string
      env_file_dir:
        description: '环境变量文件（.env / .env.example）所在目录（相对目标仓库根目录），留空表示项目根目录'
        required: false
        default: ''
        type: string
      image_name:
        description: '镜像名称与 tag（仅 mode=build 生效），例如 myimg:latest。留空则默认使用 <repo_name>:latest（repo_name 取自 repo_url 的项目名）'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  # 克隆目标仓库的本地目录名
  TARGET_DIR: target-repo
  # 镜像列表文件（build/pull 两个分支共同写入，导出步骤统一消费）
  IMAGE_LIST_FILE: image-list.txt

jobs:
  build-and-package:
    name: Build / Pull and Package Images
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ---------------------------------------------------------------
      # Step 1: 检出本仓库（workflow 所在仓库）
      # ---------------------------------------------------------------
      - name: Checkout 本仓库
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # Step 2: 校验输入参数（任何一项不通过则立即终止）
      # ---------------------------------------------------------------
      - name: 校验输入参数
        env:
          REPO_URL: ${{ inputs.repo_url }}
          PLATFORM: ${{ inputs.platform }}
          MODE: ${{ inputs.mode }}
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          COMPOSE_FILE_PATH: ${{ inputs.compose_file_path }}
          ENV_FILE_DIR: ${{ inputs.env_file_dir }}
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }

          # -- 1. 仓库地址格式校验（允许可选的 .git 后缀与结尾斜杠）--
          if [[ ! "$REPO_URL" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(\.git)?/?$ ]]; then
            fail "repo_url 不合法（当前值：$REPO_URL）。必须是形如 https://github.com/<owner>/<repo> 的 GitHub 仓库地址"
          fi

          # -- 2. 路径参数校验（必须为相对路径，且不得包含 ..）--
          for p in "$DOCKERFILE_PATH" "$COMPOSE_FILE_PATH" "$ENV_FILE_DIR"; do
            [[ -z "$p" ]] && continue
            [[ "$p" == /* ]] && fail "路径参数必须为相对路径（相对目标仓库根目录）：$p"
            [[ "$p" == *..* ]] && fail "路径参数不得包含 '..'：$p"
          done

          # -- 3. 模式联动校验 --
          if [[ "$MODE" == "build" ]]; then
            if [[ -z "${IMAGE_NAME// /}" ]]; then
              # 留空时构建阶段将默认使用 <repo_name>:latest，此处跳过格式校验
              echo "mode=build：未填写 image_name，构建时将默认使用 <repo_name>:latest"
            else
              if [[ "$IMAGE_NAME" != *:* ]]; then
                fail "image_name 必须包含冒号 ':'（即必须显式指定 tag，格式 name:tag），当前值：$IMAGE_NAME"
              fi
              # 按最后一个冒号拆分（兼容 registry.example.com:5000/name 形式的镜像名）
              NAME_PART="${IMAGE_NAME%:*}"
              TAG_PART="${IMAGE_NAME##*:}"
              if [[ -z "$NAME_PART" ]]; then
                fail "image_name 的名称部分不能为空，当前值：$IMAGE_NAME"
              fi
              if [[ -z "$TAG_PART" ]]; then
                fail "image_name 的 tag 部分不能为空（必须显式指定 tag），当前值：$IMAGE_NAME"
              fi
              if [[ "$TAG_PART" == */* ]]; then
                fail "image_name 格式不正确（tag 部分不能包含 '/'），当前值：$IMAGE_NAME"
              fi
              if [[ "$IMAGE_NAME" =~ [[:space:]] ]]; then
                fail "image_name 不能包含空白字符，当前值：$IMAGE_NAME"
              fi
              if [[ "$NAME_PART" =~ [A-Z] ]]; then
                fail "image_name 的名称部分必须全小写（Docker 镜像名规范），当前值：$IMAGE_NAME"
              fi
            fi
          else
            echo "mode=pull：image_name 将被忽略（镜像列表由 Compose 文件决定）"
          fi

          echo "✅ 输入参数校验通过（mode=$MODE，platform=$PLATFORM）"

      # ---------------------------------------------------------------
      # Step 3: 浅克隆用户目标仓库
      #   私有仓库支持：在本仓库 Settings → Secrets → Actions 中配置
      #   CLONE_PAT（具有 repo 读权限的 PAT）即可，无需修改 workflow
      #   GIT_TERMINAL_PROMPT=0：凭据缺失时快速失败，避免挂起等待输入
      # ---------------------------------------------------------------
      - name: 克隆目标仓库
        env:
          REPO_URL: ${{ inputs.repo_url }}
          CLONE_PAT: ${{ secrets.CLONE_PAT }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail

          CLONE_URL="$REPO_URL"
          if [[ -n "$CLONE_PAT" ]]; then
            # 将 https://github.com/... 替换为带 PAT 的形式（GitHub 会在日志中自动掩码令牌）
            CLONE_URL="https://x-access-token:${CLONE_PAT}@github.com/${REPO_URL#https://github.com/}"
            echo "已配置 CLONE_PAT，将以令牌方式克隆私有仓库"
          fi

          if ! git clone --depth 1 "$CLONE_URL" "$TARGET_DIR"; then
            echo "::error::克隆失败：$REPO_URL"
            echo "请依次检查："
            echo "  1. 仓库地址是否正确、仓库是否存在"
            echo "  2. 若为私有仓库，请在本仓库 Settings → Secrets and variables → Actions 中配置 CLONE_PAT（需 repo 读权限的 PAT）"
            exit 1
          fi
          echo "✅ 目标仓库克隆成功"

      # ---------------------------------------------------------------
      # Step 4: 安装 QEMU + Buildx（跨平台构建 / 拉取的前提）
      #   QEMU：在 x86 Runner 上模拟 arm64 执行 Dockerfile 中的 RUN 指令
      #   Buildx：docker-container 驱动构建器，支持 --platform 跨平台构建
      # ---------------------------------------------------------------
      - name: 安装 QEMU（跨平台模拟）
        uses: docker/setup-qemu-action@v3

      - name: 安装 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------------
      # Step 5: 登录私有镜像仓库（可选）
      #   配置了 REGISTRY_USERNAME / REGISTRY_PASSWORD secrets 时自动生效，
      #   用于 build 模式拉取私有基础镜像、pull 模式拉取私有业务镜像
      # ---------------------------------------------------------------
      - name: 登录镜像仓库（可选）
        env:
          REGISTRY_SERVER: ${{ secrets.REGISTRY_SERVER }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${REGISTRY_USERNAME:-}" || -z "${REGISTRY_PASSWORD:-}" ]]; then
            echo "未配置 REGISTRY_USERNAME / REGISTRY_PASSWORD secrets，跳过镜像仓库登录（仅可访问公开镜像）"
            exit 0
          fi
          SERVER="${REGISTRY_SERVER:-docker.io}"
          echo "🔐 登录镜像仓库：$SERVER"
          echo "$REGISTRY_PASSWORD" | docker login "$SERVER" --username "$REGISTRY_USERNAME" --password-stdin
          echo "REGISTRY_LOGGED_IN=1" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # Step 6: 准备环境变量文件（.env，可选）
      #   部分项目的 Docker build / Compose pull 会读取 .env，而仓库通常只
      #   提供 .env.example 模板。若指定目录下存在 .env.example 且不存在
      #   .env，则自动复制一份，避免因缺少 .env 导致构建/拉取失败。
      #   env_file_dir 留空表示目标仓库根目录。
      # ---------------------------------------------------------------
      - name: 准备环境变量文件（.env）
        working-directory: target-repo
        env:
          ENV_FILE_DIR: ${{ inputs.env_file_dir }}
        run: |
          set -euo pipefail

          # 留空时使用目标仓库根目录
          TARGET_PATH="${ENV_FILE_DIR:-.}"
          if [[ ! -d "$TARGET_PATH" ]]; then
            echo "::error::环境变量文件目录不存在：$TARGET_PATH（路径相对于目标仓库根目录）"
            exit 1
          fi

          if [[ -f "$TARGET_PATH/.env" ]]; then
            echo "ℹ️ $TARGET_PATH/.env 已存在，跳过生成"
            exit 0
          fi

          if [[ ! -f "$TARGET_PATH/.env.example" ]]; then
            echo "ℹ️ 未找到 $TARGET_PATH/.env.example，跳过生成（如项目无需 .env 可忽略）"
            exit 0
          fi

          cp "$TARGET_PATH/.env.example" "$TARGET_PATH/.env"
          echo "✅ 已根据 .env.example 生成 $TARGET_PATH/.env"

      # ---------------------------------------------------------------
      # Step 7A: 模式 build —— 从 Dockerfile 构建镜像
      #   注意：setup-buildx 之后默认构建器为 docker-container 驱动，
      #   构建结果不会自动进入本地镜像库，必须显式 --load 才能 docker save
      # ---------------------------------------------------------------
      - name: 构建镜像（mode=build）
        if: ${{ inputs.mode == 'build' }}
        working-directory: target-repo
        env:
          REPO_URL: ${{ inputs.repo_url }}
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          IMAGE_NAME: ${{ inputs.image_name }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail

          # image_name 留空时，默认使用 <repo_name>:latest（repo_name 取自 repo_url 的项目名）
          if [[ -z "${IMAGE_NAME// /}" ]]; then
            REPO_NAME="${REPO_URL%/}"
            REPO_NAME="${REPO_NAME%.git}"
            REPO_NAME="${REPO_NAME##*/}"
            REPO_NAME="${REPO_NAME,,}"
            if [[ -z "$REPO_NAME" ]]; then
              echo "::error::image_name 留空且无法从 repo_url 解析出项目名：$REPO_URL"
              exit 1
            fi
            IMAGE_NAME="${REPO_NAME}:latest"
            echo "ℹ️ 未填写 image_name，已使用默认值：$IMAGE_NAME"
          fi
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

          # Dockerfile 存在性检查（为空时使用默认值）
          DOCKERFILE_PATH="${DOCKERFILE_PATH:-Dockerfile}"
          if [[ ! -f "$DOCKERFILE_PATH" ]]; then
            echo "::error::未找到 Dockerfile：$DOCKERFILE_PATH（路径相对于目标仓库根目录）"
            exit 1
          fi

          echo "🔨 开始构建镜像 $IMAGE_NAME（平台：$PLATFORM，Dockerfile：$DOCKERFILE_PATH）"
          if ! docker buildx build --platform "$PLATFORM" --load -f "$DOCKERFILE_PATH" -t "$IMAGE_NAME" .; then
            echo "::error::镜像构建失败，请检查 Dockerfile 内容及其依赖的网络资源是否可访问"
            exit 1
          fi

          # 确认镜像确实已进入本地镜像库（防止 --load 未生效等边缘情况）
          if ! docker image inspect "$IMAGE_NAME" >/dev/null 2>&1; then
            echo "::error::镜像构建完成但未在本地镜像库中找到：$IMAGE_NAME"
            exit 1
          fi

          # 记录镜像列表，供导出步骤统一消费
          echo "$IMAGE_NAME" > "$GITHUB_WORKSPACE/$IMAGE_LIST_FILE"
          echo "✅ 镜像构建完成：$IMAGE_NAME"

      # ---------------------------------------------------------------
      # Step 7B: 模式 pull —— 从 Compose 文件拉取全部镜像
      #   不启动任何容器：先解析 Compose 得到镜像清单，
      #   再逐个以 --platform 强制拉取目标架构，避免拉到 Runner 默认架构
      # ---------------------------------------------------------------
      - name: 拉取 Compose 镜像（mode=pull）
        if: ${{ inputs.mode == 'pull' }}
        working-directory: target-repo
        env:
          COMPOSE_FILE_PATH: ${{ inputs.compose_file_path }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail

          # Compose 文件存在性检查（为空时使用默认值）
          COMPOSE_FILE_PATH="${COMPOSE_FILE_PATH:-docker-compose.yml}"
          if [[ ! -f "$COMPOSE_FILE_PATH" ]]; then
            echo "::error::未找到 Compose 文件：$COMPOSE_FILE_PATH（路径相对于目标仓库根目录）"
            exit 1
          fi

          # 解析 Compose 文件（格式错误、引用了未定义的环境变量等会在这里失败）
          if ! CONFIG_JSON=$(docker compose -f "$COMPOSE_FILE_PATH" config --format json 2>/dev/null); then
            echo "::error::解析 Compose 文件失败：$COMPOSE_FILE_PATH。请确认文件格式正确、引用的环境变量已有定义或默认值"
            exit 1
          fi

          # 检测 build 型服务（声明了 build: 字段）：pull 模式只负责拉取，不执行构建
          BUILD_SVCS=$(jq -r '.services | to_entries[] | select(.value.build != null) | .key' <<<"$CONFIG_JSON" | grep -v '^$' || true)
          if [[ -n "$BUILD_SVCS" ]]; then
            echo "::error::Compose 文件中存在 build 型服务（声明了 build: 字段）：$(echo "$BUILD_SVCS" | xargs)"
            echo "pull 模式只负责拉取镜像，不执行构建。请任选其一："
            echo "  1. 在目标仓库中为这些服务补充 image: 字段（指向 registry 中已存在的镜像）"
            echo "  2. 改用 build 模式（单一 Dockerfile）"
            exit 1
          fi

          # 解析 Compose 文件中定义的全部镜像
          if ! IMAGES=$(docker compose -f "$COMPOSE_FILE_PATH" config --images 2>/dev/null | sort -u); then
            echo "::error::获取镜像清单失败：$COMPOSE_FILE_PATH"
            exit 1
          fi
          if [[ -z "$IMAGES" ]]; then
            echo "::error::Compose 文件中未解析到任何镜像，请检查 services.*.image 配置"
            exit 1
          fi

          echo "📦 将拉取以下镜像（平台：$PLATFORM）："
          printf '  - %s\n' $IMAGES

          # 逐个强制拉取目标平台架构
          while IFS= read -r img; do
            [[ -z "$img" ]] && continue
            if ! docker pull --platform "$PLATFORM" "$img"; then
              echo "::error::拉取镜像失败：$img（平台：$PLATFORM）"
              echo "可能原因：镜像名拼写错误 / 镜像不存在 / 该镜像不支持目标架构 / 私有镜像仓库未配置登录（见 README「私有镜像仓库支持」）"
              exit 1
            fi
          done <<< "$IMAGES"

          # 记录镜像列表，供导出步骤统一消费
          echo "$IMAGES" > "$GITHUB_WORKSPACE/$IMAGE_LIST_FILE"
          echo "✅ 全部镜像拉取完成"

      # ---------------------------------------------------------------
      # Step 8: 验证镜像架构
      #   逐一检查本地镜像的 Os/Architecture 是否与目标平台一致，
      #   防止拉错/构建错架构的镜像被打进离线包（元数据为 unknown 的
      #   老镜像跳过强校验，仅告警）
      # ---------------------------------------------------------------
      - name: 验证镜像架构
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail

          if [[ ! -s "$IMAGE_LIST_FILE" ]]; then
            echo "::error::未找到镜像列表文件 $IMAGE_LIST_FILE，前置步骤可能未执行"
            exit 1
          fi

          PLATFORM_OS="${PLATFORM%%/*}"
          PLATFORM_ARCH="${PLATFORM##*/}"
          MISMATCH=0

          while IFS= read -r img; do
            [[ -z "$img" ]] && continue
            actual=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$img" 2>/dev/null) || {
              echo "::error::镜像在本地镜像库中不存在：$img"
              exit 1
            }
            if [[ "$actual" == "$PLATFORM_OS/$PLATFORM_ARCH" ]]; then
              echo "✅ $img → $actual"
            elif [[ "$actual" == *"/unknown" || "$actual" == "unknown/unknown" ]]; then
              echo "⚠️ $img 架构元数据为 $actual（常见于较老的镜像），跳过强校验"
            else
              echo "::error::镜像 $img 的架构为 $actual，与目标平台 $PLATFORM 不符"
              MISMATCH=1
            fi
          done < "$IMAGE_LIST_FILE"

          if [[ "$MISMATCH" -ne 0 ]]; then
            echo "::error::存在架构不匹配的镜像，已终止打包。请检查镜像是否支持目标平台"
            exit 1
          fi
          echo "✅ 全部镜像架构校验通过"

      # ---------------------------------------------------------------
      # Step 9: docker save 导出全部镜像，并压缩为 TGZ
      #   文件名：<repo-name>_docker-images_<platform>_<yyyymmdd-HHMMSS>.tgz
      #   Artifact 命名：与文件名同基名（不含 .tgz 扩展名）
      #   repo-name 取自 repo_url 的项目名；时间戳使用 Asia/Shanghai 时区
      # ---------------------------------------------------------------
      - name: 导出镜像并压缩为 TGZ
        env:
          REPO_URL: ${{ inputs.repo_url }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail

          # 从 repo_url 提取项目名：去掉可选结尾斜杠与 .git 后缀，取最后一段路径
          REPO_NAME="${REPO_URL%/}"
          REPO_NAME="${REPO_NAME%.git}"
          REPO_NAME="${REPO_NAME##*/}"
          if [[ -z "$REPO_NAME" ]]; then
            echo "::error::无法从 repo_url 解析出项目名：$REPO_URL"
            exit 1
          fi

          # linux/amd64 -> linux-amd64（文件名中不能包含 /）
          PLATFORM_TAG="${PLATFORM//\//-}"
          # 北京时间戳，形如 20261009-153045
          TIMESTAMP="$(TZ='Asia/Shanghai' date +%Y%m%d-%H%M%S)"

          ARTIFACT_NAME="${REPO_NAME}_docker-images_${PLATFORM_TAG}_${TIMESTAMP}"
          TGZ_NAME="${ARTIFACT_NAME}.tgz"

          if [[ ! -s "$IMAGE_LIST_FILE" ]]; then
            echo "::error::未找到镜像列表文件 $IMAGE_LIST_FILE，前置步骤可能未执行"
            exit 1
          fi

          mkdir -p dist
          mapfile -t IMAGES < <(grep -v '^[[:space:]]*$' "$IMAGE_LIST_FILE" || true)

          if [[ ${#IMAGES[@]} -eq 0 ]]; then
            echo "::error::镜像列表为空，无法导出"
            exit 1
          fi

          echo "📤 导出以下 ${#IMAGES[@]} 个镜像："
          printf '  - %s\n' "${IMAGES[@]}"

          if ! docker save "${IMAGES[@]}" | gzip > "dist/$TGZ_NAME"; then
            echo "::error::docker save / 压缩失败"
            exit 1
          fi

          if [[ ! -s "dist/$TGZ_NAME" ]]; then
            echo "::error::TGZ 产物为空文件：dist/$TGZ_NAME"
            exit 1
          fi

          TGZ_SHA256=$(sha256sum "dist/$TGZ_NAME" | awk '{print $1}')
          TGZ_SIZE=$(du -h "dist/$TGZ_NAME" | cut -f1)

          {
            echo "ARTIFACT_NAME=$ARTIFACT_NAME"
            echo "TGZ_NAME=$TGZ_NAME"
            echo "TGZ_SHA256=$TGZ_SHA256"
            echo "TGZ_SIZE=$TGZ_SIZE"
          } >> "$GITHUB_ENV"

          echo "✅ 打包完成：dist/$TGZ_NAME（${TGZ_SIZE}，SHA256：${TGZ_SHA256}）"
          ls -lh dist/

      # ---------------------------------------------------------------
      # Step 10: 上传 TGZ Artifact
      #   每次运行的产物通过时间戳区分，互不覆盖
      #   注：Artifact 下载后为 zip 包，解压即得到 TGZ 文件
      # ---------------------------------------------------------------
      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/${{ env.TGZ_NAME }}
          retention-days: 14
          if-no-files-found: error

      # ---------------------------------------------------------------
      # Step 11: 输出运行摘要（显示在运行页面底部的 Summary 区域）
      #   包含：配置参数、产物文件名/大小/SHA256、镜像清单（架构+大小）、
      #   目标服务器导入方法；失败时给出排查指引
      # ---------------------------------------------------------------
      - name: 输出运行摘要
        if: ${{ always() }}
        env:
          REPO_URL: ${{ inputs.repo_url }}
          PLATFORM: ${{ inputs.platform }}
          MODE: ${{ inputs.mode }}
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          COMPOSE_FILE_PATH: ${{ inputs.compose_file_path }}
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          # 优先使用构建阶段解析出的镜像名（含默认值），否则回退到原始输入
          IMAGE_NAME="${IMAGE_NAME:-$INPUT_IMAGE_NAME}"

          # 取镜像大小（人类可读），镜像已不存在时返回 "-"
          img_size() {
            local bytes
            if bytes=$(docker image inspect --format '{{.Size}}' "$1" 2>/dev/null); then
              numfmt --to=iec --suffix=B "$bytes" 2>/dev/null || echo "${bytes}B"
            else
              echo "-"
            fi
          }

          # 取镜像架构，镜像已不存在时返回 "-"
          img_arch() {
            docker image inspect --format '{{.Os}}/{{.Architecture}}' "$1" 2>/dev/null || echo "-"
          }

          {
            echo "## 📦 镜像构建打包摘要"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 运行编号 | #${RUN_NUMBER} |"
            echo "| 目标仓库 | \`${REPO_URL}\` |"
            echo "| 模式 | \`${MODE}\` |"
            echo "| 目标平台 | \`${PLATFORM}\` |"
            if [[ "$MODE" == "build" ]]; then
              echo "| Dockerfile | \`${DOCKERFILE_PATH:-Dockerfile}\` |"
              echo "| 镜像名称 | \`${IMAGE_NAME}\` |"
            else
              echo "| Compose 文件 | \`${COMPOSE_FILE_PATH:-docker-compose.yml}\` |"
            fi
            echo "| 运行状态 | \`${JOB_STATUS}\` |"
            echo ""

            if [[ "$JOB_STATUS" == "success" && -n "${TGZ_NAME:-}" && -f "dist/$TGZ_NAME" ]]; then
              echo "### ✅ 产出 Artifact"
              echo ""
              echo "| 项目 | 值 |"
              echo "|---|---|"
              echo "| Artifact 名称 | \`${ARTIFACT_NAME}\` |"
              echo "| 文件名 | \`${TGZ_NAME}\` |"
              echo "| 大小 | ${TGZ_SIZE:-?} |"
              echo "| SHA256 | \`${TGZ_SHA256:-?}\` |"

              if [[ -f "$IMAGE_LIST_FILE" ]]; then
                mapfile -t IMAGES < <(grep -v '^[[:space:]]*$' "$IMAGE_LIST_FILE" || true)
                echo "| 包含镜像数 | ${#IMAGES[@]} |"
                echo ""
                echo "### 镜像清单"
                echo ""
                echo "| 镜像 | 架构 | 大小 |"
                echo "|---|---|---|"
                for img in "${IMAGES[@]}"; do
                  echo "| \`${img}\` | $(img_arch "$img") | $(img_size "$img") |"
                done
              fi
              echo ""
              echo "### 目标服务器导入方法"
              echo ""
              echo "从本次运行页面的 **Artifacts** 区域下载 \`${ARTIFACT_NAME}\`（下载得到 zip，解压即为本 TGZ 文件）："
              echo ""
              echo '```bash'
              echo "# 1. 校验完整性（可选，SHA256 见上表）"
              echo "echo \"${TGZ_SHA256:-<sha256>}  ${TGZ_NAME}\" | sha256sum -c"
              echo ""
              echo "# 2. 导入全部镜像"
              echo "docker load -i <(gunzip -c ${TGZ_NAME})"
              echo ""
              echo "# 3. 验证导入结果"
              echo "docker images"
              echo '```'
            else
              echo "### ⚠️ 本次运行未产出 Artifact"
              echo ""
              echo "运行状态：\`${JOB_STATUS}\`。请查看上方失败步骤的日志定位原因，常见问题："
              echo ""
              echo "- 参数校验失败 → 检查 repo_url 地址格式、image_name 是否为 name:tag 形式"
              echo "- 克隆失败 → 检查仓库地址；私有仓库需配置 \`CLONE_PAT\` secret"
              echo "- 构建失败 → 检查 Dockerfile 及其依赖的网络资源；arm64 构建较慢属正常现象"
              echo "- 拉取失败 → 检查镜像名拼写、目标架构支持；私有镜像仓库需配置登录 secrets"
              echo ""
              echo "更多排查指引见仓库 README 的 **FAQ 与故障排查** 章节。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------
      # Step 12: 登出镜像仓库（若曾登录，尽力而为）
      # ---------------------------------------------------------------
      - name: 登出镜像仓库
        if: ${{ always() && env.REGISTRY_LOGGED_IN == '1' }}
        continue-on-error: true
        run: docker logout || true

      # ---------------------------------------------------------------
      # Step 13: 清理 Docker 缓存（尽力而为，失败不影响结果）
      #   注意：带 tag 的镜像不会被删除，仅清理构建缓存/悬空层
      # ---------------------------------------------------------------
      - name: 清理 Docker 缓存
        if: ${{ always() }}
        continue-on-error: true
        run: docker system prune -f
